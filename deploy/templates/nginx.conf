# Install in /etc/nginx/conf.d/oracle-patching.conf after reviewing nginx -t.
# This log format omits query strings, Authorization and request bodies.
log_format opu_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name @@HOSTNAME@@;
    access_log off;
    error_log /dev/null crit;
    return 444;
}
server {
    listen 443 ssl;
    server_name @@HOSTNAME@@;
    ssl_certificate @@TLS_CERT@@;
    ssl_certificate_key @@TLS_KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/oracle-patching.access.log opu_safe;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # Provider callback query parameters must never reach proxy logs.
    location /auth/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
